---
# Playbook chính. Role được thêm dần theo mốc, đúng thứ tự phụ thuộc:
# OS -> Database -> LB/VIP -> Storage -> Web/App
#
# Chạy: ansible-playbook site.yml
# Kiểm tra drift: ansible-playbook site.yml --check --diff

- name: M1 — Chuẩn hoá hệ điều hành cho toàn bộ node lab
  hosts: all
  gather_facts: true
  roles:
    - role: common
      tags: [common, m1]

