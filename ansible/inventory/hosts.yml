---
# Every node address is declared here once; roles derive everything else from it.
lab:
  children:
    router:
      hosts:
        fw01:
          lab_ip: 172.16.10.254
          lab_zone: client
    lb:
      hosts:
        lb01:
          lab_ip: 192.168.10.11
          lab_zone: dmz
          keepalived_state: MASTER
          keepalived_priority: 110
        lb02:
          lab_ip: 192.168.10.12
          lab_zone: dmz
          keepalived_state: BACKUP
          keepalived_priority: 100
    web:
      hosts:
        web01:
          lab_ip: 192.168.20.11
          lab_zone: app
        web02:
          lab_ip: 192.168.20.12
          lab_zone: app
    nfs:
      hosts:
        nfs01:
          lab_ip: 192.168.20.21
          lab_zone: app
    db:
      hosts:
        db01:
          lab_ip: 192.168.30.11
          lab_zone: db
          mysql_server_id: 1
        db02:
          lab_ip: 192.168.30.12
          lab_zone: db
          mysql_server_id: 2
    mgmt:
      hosts:
        mgmt01:
          lab_ip: 172.16.10.11
          lab_zone: client
          # the control node configures itself without SSHing to itself
          ansible_connection: local
