---
# Nhóm hai chiều:
#   - theo vai trò (lb, web, db, nfs) để site.yml gán role
#   - theo họ phân phối (rocky, ubuntu) để role common chọn đúng gói và firewall
all:
  children:

    lb:
      hosts:
        lb01:
          ansible_host: 10.10.10.11
          keepalived_state: MASTER
          keepalived_priority: 110
        lb02:
          ansible_host: 10.10.10.12
          keepalived_state: BACKUP
          keepalived_priority: 100

    web:
      hosts:
        web01:
          ansible_host: 10.10.10.21
          wp_installer: true        # chỉ node này chạy wp core install (M4)
        web02:
          ansible_host: 10.10.10.22
          wp_installer: false

    db:
      hosts:
        db01:
          ansible_host: 10.10.10.31
          mysql_server_id: 31
          mysql_role: primary
        db02:
          ansible_host: 10.10.10.32
          mysql_server_id: 32
          mysql_role: replica

    nfs:
      hosts:
        nfs01:
          ansible_host: 10.10.10.41

    # --- Nhóm theo họ phân phối ---
    rocky:
      children:
        web:
        db:

    ubuntu:
      children:
        lb:
        nfs:
