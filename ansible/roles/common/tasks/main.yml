---
- name: Xác định tên dịch vụ khác nhau giữa hai họ phân phối
  ansible.builtin.set_fact:
    chrony_service: "{{ 'chronyd' if ansible_os_family == 'RedHat' else 'chrony' }}"
    needs_nginx_user: "{{ inventory_hostname in (groups['web'] | default([])) + (groups['nfs'] | default([])) }}"

- name: Cài gói nền và bộ công cụ chẩn đoán
  ansible.builtin.package:
    name: "{{ common_packages_redhat if ansible_os_family == 'RedHat' else common_packages_debian }}"
    state: present
  register: pkg_result
  retries: 3
  delay: 5
  until: pkg_result is succeeded

- name: Đặt múi giờ
  community.general.timezone:
    name: "{{ timezone }}"

- name: Sinh /etc/hosts từ inventory
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

# --- Đồng bộ thời gian -------------------------------------------------------
# Lệch giờ giữa các node làm log không khớp và gây lỗi xác thực rất khó đoán.
- name: Bật và khởi động chrony
  ansible.builtin.service:
    name: "{{ chrony_service }}"
    state: started
    enabled: true

# --- User nginx với UID/GID cố định -----------------------------------------
# Phải tạo TRƯỚC khi cài package Nginx/NFS ở M4, nếu không package tự cấp số
# tuỳ ý và lệch giữa các máy, gây lỗi quyền trên NFS rất khó nhìn ra.
- name: Tạo group nginx với GID cố định
  ansible.builtin.group:
    name: "{{ nginx_user }}"
    gid: "{{ nginx_gid }}"
    state: present
  when: needs_nginx_user | bool

- name: Tạo user nginx với UID cố định
  ansible.builtin.user:
    name: "{{ nginx_user }}"
    uid: "{{ nginx_uid }}"
    group: "{{ nginx_user }}"
    shell: /sbin/nologin
    create_home: false
    system: true
    state: present
  when: needs_nginx_user | bool

# --- Cấu hình riêng theo họ phân phối ---------------------------------------
- name: Áp dụng cấu hình riêng cho Rocky Linux
  ansible.builtin.include_tasks: RedHat.yml
  when: ansible_os_family == 'RedHat'

- name: Áp dụng cấu hình riêng cho Ubuntu
  ansible.builtin.include_tasks: Debian.yml
  when: ansible_os_family == 'Debian'

# --- Báo cáo để đối chiếu ----------------------------------------------------
- name: Hiển thị thông tin nhận dạng node
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} | {{ ansible_distribution }} {{ ansible_distribution_version }}
      | lab_iface={{ lab_iface }} | ip={{ ansible_host }}
