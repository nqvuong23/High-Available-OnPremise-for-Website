---
# Rocky Linux 9: firewalld + SELinux Enforcing.
#
# THỨ TỰ QUAN TRỌNG: mở SSH ở cả hai zone TRƯỚC khi gán NIC lab vào zone internal.
# Làm ngược lại sẽ tự khoá mình ra khỏi máy. Lưới an toàn: đường NAT của
# `vagrant ssh` vẫn nằm ở zone public nên vẫn vào sửa được nếu lỡ sai.

- name: Bật và khởi động firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Mở SSH ở zone public (đường NAT của vagrant ssh)
  ansible.posix.firewalld:
    zone: public
    service: ssh
    permanent: true
    immediate: true
    state: enabled

- name: Mở SSH ở zone internal (đường mạng lab của Ansible)
  ansible.posix.firewalld:
    zone: internal
    service: ssh
    permanent: true
    immediate: true
    state: enabled

- name: Gán NIC lab vào zone internal
  ansible.posix.firewalld:
    zone: internal
    interface: "{{ lab_iface }}"
    permanent: true
    immediate: true
    state: enabled
  when: lab_iface | default('') | length > 0

# --- SELinux ----------------------------------------------------------------
# Giữ Enforcing chứ không hạ xuống Permissive để né lỗi. SELinux chính là thứ
# tạo ra các tình huống troubleshooting thực tế nhất của project này.
- name: Đặt SELinux ở chế độ Enforcing với policy targeted
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
  register: selinux_result

- name: Khởi động lại khi SELinux yêu cầu gán nhãn lại toàn bộ filesystem
  ansible.builtin.reboot:
    reboot_timeout: 900
    msg: "Reboot để SELinux relabel sau khi chuyển sang Enforcing"
  when: selinux_result.reboot_required | default(false) | bool

- name: Xác nhận SELinux đang Enforcing
  ansible.builtin.command: getenforce
  register: getenforce_result
  changed_when: false
  failed_when: getenforce_result.stdout.strip() != 'Enforcing'
