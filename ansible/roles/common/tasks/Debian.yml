---
# Ubuntu 24.04: ufw với chính sách mặc định chặn chiều vào.
#
# THỨ TỰ QUAN TRỌNG: cho phép SSH TRƯỚC rồi mới bật ufw. Bật trước khi mở cổng 22
# sẽ cắt đứt phiên SSH hiện tại và Ansible đứng hình.

- name: Cho phép SSH trên mọi interface trước khi bật ufw
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: "SSH cho ca duong NAT lan duong lab"

- name: Bật ufw với chính sách mặc định chặn chiều vào
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Cho phép mọi kết nối đi ra
  community.general.ufw:
    policy: allow
    direction: outgoing

# Ubuntu cài sẵn systemd-timesyncd. Gói chrony của Ubuntu xung đột và apt sẽ tự
# gỡ timesyncd khi cài chrony, nhưng kiểm tra lại cho chắc để không có hai dịch
# vụ giờ cùng chạy.
- name: Thu thập trạng thái các dịch vụ
  ansible.builtin.service_facts:

- name: Tắt và mask systemd-timesyncd nếu còn tồn tại
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false
    masked: true
  when: "'systemd-timesyncd.service' in ansible_facts.services"
