---
# bump on every zone change: an unchanged serial makes caches ignore the edit
router_dns_serial: "2026101701"
router_dns_forwarders: "{{ lab_upstream_dns }}"
# zone whose gateway address answers as ns1
router_ns_zone: dmz
router_ntp_local_stratum: 10
router_dns_check_host: "{{ groups['web'][0] }}"
router_zones_dir: /etc/bind/zones
# NIC the default route leaves through, which is the only interface masqueraded
router_nat_iface: "{{ ansible_facts.default_ipv4.interface | default('') }}"
