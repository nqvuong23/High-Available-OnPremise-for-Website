---
# PKI lives inside this role: a role directory named pki would match .gitignore
haproxy_pki_host: "{{ groups['lb'][0] }}"
haproxy_pki_dir: /root/ca
haproxy_ca_days: 3650
haproxy_cert_days: 825
haproxy_ca_subject: "/C=VN/O=Lab/CN={{ lab_domain }} Root CA"
haproxy_cert_dir: /etc/haproxy/certs
haproxy_pem: "{{ haproxy_cert_dir }}/shop.pem"

# inter 2s fall 3 is why a broken web node leaves the backend in about 6 seconds
haproxy_check_params: inter 2s fall 3 rise 2

haproxy_ssl_ciphers: >-
  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
